<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBT Admin Panel | ระบบจัดการฐานข้อมูล</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        dark: '#0a0f1c',
                        card: '#111827',
                        primary: '#00f2fe',
                        secondary: '#7928ca'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0f1c; color: #f1f5f9; }
        .glass-header { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-table th { background: rgba(0, 242, 254, 0.1); color: #00f2fe; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        .data-table td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); color: #cbd5e1; font-size: 0.875rem; }
        .data-table tr:hover td { background: rgba(255,255,255,0.02); }
        .modal-bg { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0f1c; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }
    </style>
</head>
<body class="font-sans antialiased flex h-screen overflow-hidden">

    <aside class="w-64 bg-card border-r border-white/5 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-white/5">
            <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
                DBT Admin Panel
            </span>
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2">
            <button onclick="switchTab('programs')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-cyan-500/10 hover:text-cyan-400 transition" id="nav-programs">
                <i class="fa-solid fa-book w-5 text-center"></i> จัดการหลักสูตร
            </button>
            <button onclick="switchTab('teachers')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-cyan-500/10 hover:text-cyan-400 transition" id="nav-teachers">
                <i class="fa-solid fa-chalkboard-user w-5 text-center"></i> คณาจารย์
            </button>
            <button onclick="switchTab('news')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-cyan-500/10 hover:text-cyan-400 transition" id="nav-news">
                <i class="fa-solid fa-newspaper w-5 text-center"></i> ข่าวสารและกิจกรรม
            </button>
            <button onclick="switchTab('applicants')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-cyan-500/10 hover:text-cyan-400 transition" id="nav-applicants">
                <i class="fa-solid fa-user-graduate w-5 text-center"></i> ผู้สมัครเรียน
            </button>
        </nav>
        <div class="p-4 border-t border-white/5 text-xs text-slate-500 text-center">
            ระบบฐานข้อมูล Google Sheets
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        <header class="h-16 glass-header flex items-center justify-between px-6 z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-slate-400"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 id="page-title" class="text-lg font-bold text-white">กำลังโหลด...</h2>
            </div>
            <div>
                <button onclick="openModal()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 shadow-lg shadow-cyan-500/20 transition">
                    <i class="fa-solid fa-plus"></i> เพิ่มข้อมูลใหม่
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-6 relative">
            <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center bg-dark/80 backdrop-blur-sm z-20 hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-cyan-400 mb-4"></i>
                <p class="text-slate-400 font-medium tracking-wider">กำลังประมวลผลข้อมูล...</p>
            </div>
            
            <div class="bg-card rounded-2xl border border-white/5 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full data-table">
                        <thead id="table-head">
                            </thead>
                        <tbody id="table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="crudModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-card border border-white/10 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white" id="modal-title">เพิ่มข้อมูล</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-rose-400 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <form id="crudForm" class="space-y-4">
                    <input type="hidden" id="form-id">
                    <div id="form-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        </div>
                </form>
            </div>
            <div class="p-6 border-t border-white/5 flex justify-end gap-3 bg-slate-900/50 rounded-b-2xl">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-slate-300 font-medium hover:bg-white/5 transition">ยกเลิก</button>
                <button onclick="saveData()" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold flex items-center gap-2 transition shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-save"></i> บันทึกข้อมูล
                </button>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // ⚠️ การตั้งค่าการเชื่อมต่อ (แก้ไข 2 บรรทัดนี้)
        // -------------------------------------------------------------
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzXKU23m-SWSj34rIencDKjdgPptk5D2GbaENscZ5AMdJ5QYTes52-Od1HjyrHHwcqS/exec';
        const API_KEY = '2162ab62e072c2d9149c464c465926929a8245696a4c47083508512ff3b6f797'; // ตรงกับใน code.gs

        // โครงสร้างข้อมูล Schema
        const SCHEMAS = {
            programs: [
                { key: 'level', label: 'ระดับชั้น (ปวช./ปวส.)', type: 'text' },
                { key: 'name', label: 'ชื่อสาขา', type: 'text' },
                { key: 'description', label: 'รายละเอียด', type: 'textarea' },
                { key: 'duration', label: 'ระยะเวลาศึกษา (เช่น 3 ปี)', type: 'text' },
                { key: 'sort_order', label: 'ลำดับการแสดงผล', type: 'number' }
            ],
            teachers: [
                { key: 'name', label: 'ชื่อ-นามสกุล', type: 'text' },
                { key: 'position', label: 'ตำแหน่ง', type: 'text' },
                { key: 'image_url', label: 'URL รูปภาพ (แนบลิงก์รูป)', type: 'text' },
                { key: 'sort_order', label: 'ลำดับการแสดงผล', type: 'number' }
            ],
            news: [
                { key: 'title', label: 'หัวข้อข่าว', type: 'text' },
                { key: 'slug', label: 'URL Slug', type: 'text' },
                { key: 'excerpt', label: 'คำโปรย (สั้นๆ)', type: 'textarea' },
                { key: 'content', label: 'เนื้อหาข่าว', type: 'textarea' },
                { key: 'cover_url', label: 'URL รูปปก', type: 'text' },
                { key: 'published', label: 'เผยแพร่ (true/false)', type: 'text' }
            ],
            applicants: [
                { key: 'full_name', label: 'ชื่อ-สกุล', type: 'text' },
                { key: 'citizen_id', label: 'เลขบัตร ปชช.', type: 'text' },
                { key: 'phone', label: 'เบอร์โทรศัพท์', type: 'text' },
                { key: 'email', label: 'อีเมล', type: 'text' },
                { key: 'level', label: 'ระดับที่สมัคร', type: 'text' },
                { key: 'prev_school', label: 'โรงเรียนเดิม', type: 'text' },
                { key: 'gpa', label: 'เกรดเฉลี่ย', type: 'number' },
                { key: 'status', label: 'สถานะ (pending/approved/rejected)', type: 'text' }
            ]
        };

        const TAB_TITLES = {
            programs: '📚 จัดการหลักสูตร',
            teachers: '👨‍🏫 คณาจารย์',
            news: '📰 ข่าวสารและกิจกรรม',
            applicants: '🎓 ข้อมูลผู้สมัครเรียน'
        };

        let currentTab = 'programs';
        let currentData = [];
        let isEditMode = false;

        // ฟังก์ชันเมื่อเริ่มโหลดหน้า
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('programs');
        });

        // สลับแท็บหน้า
        async function switchTab(tab) {
            currentTab = tab;
            document.getElementById('page-title').innerText = TAB_TITLES[tab];
            
            // อัปเดตสไตล์ของปุ่มเมนู
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-cyan-500/10', 'text-cyan-400');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            if(activeBtn) activeBtn.classList.add('bg-cyan-500/10', 'text-cyan-400');

            await loadData();
        }

        // ดึงข้อมูล (Read)
        async function loadData() {
            showLoading(true);
            try {
                if(SCRIPT_URL.includes('YOUR_SCRIPT_ID_HERE')){
                    throw new Error('กรุณาใส่ URL ของ Web App ในโค้ดก่อน');
                }
                const response = await fetch(`${SCRIPT_URL}?sheet=${currentTab}`);
                const json = await response.json();
                if (json.ok) {
                    currentData = json.data;
                    renderTable();
                } else {
                    throw new Error(json.error);
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'ดึงข้อมูลล้มเหลว', text: error.message, background: '#111827', color: '#fff' });
            } finally {
                showLoading(false);
            }
        }

        // วาดตารางข้อมูล
        function renderTable() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const schema = SCHEMAS[currentTab];
            
            // สร้าง Header
            let thHTML = '<tr>';
            schema.forEach(field => {
                thHTML += `<th>${field.label}</th>`;
            });
            thHTML += `<th class="text-right">จัดการ</th></tr>`;
            thead.innerHTML = thHTML;

            // สร้าง Body
            tbody.innerHTML = '';
            if(currentData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${schema.length + 1}" class="text-center py-8 text-slate-500">ไม่พบข้อมูล</td></tr>`;
                return;
            }

            currentData.forEach(row => {
                let trHTML = '<tr>';
                schema.forEach(field => {
                    let val = row[field.key] || '-';
                    // ย่อข้อความถ้ายาวเกินไป
                    if(val.length > 40) val = val.substring(0, 40) + '...'; 
                    trHTML += `<td>${val}</td>`;
                });
                trHTML += `
                    <td class="text-right space-x-2">
                        <button onclick='editItem(${JSON.stringify(row).replace(/'/g, "&#39;")})' class="text-cyan-400 hover:text-cyan-300 transition p-2 bg-cyan-500/10 rounded-lg"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteItem('${row.id}')" class="text-rose-400 hover:text-rose-300 transition p-2 bg-rose-500/10 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
                tbody.innerHTML += trHTML;
            });
        }

        // จัดการ Modal
        function openModal(data = null) {
            isEditMode = !!data;
            document.getElementById('modal-title').innerText = isEditMode ? 'แก้ไขข้อมูล' : 'เพิ่มข้อมูลใหม่';
            
            const formFields = document.getElementById('form-fields');
            const schema = SCHEMAS[currentTab];
            formFields.innerHTML = '';
            
            document.getElementById('form-id').value = data ? data.id : '';

            schema.forEach(field => {
                const colSpan = field.type === 'textarea' ? 'col-span-1 md:col-span-2' : '';
                const val = data ? (data[field.key] || '') : '';
                
                let inputElement = '';
                if(field.type === 'textarea') {
                    inputElement = `<textarea id="input-${field.key}" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-cyan-400">${val}</textarea>`;
                } else {
                    inputElement = `<input type="${field.type}" id="input-${field.key}" value="${val}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">`;
                }

                formFields.innerHTML += `
                    <div class="${colSpan}">
                        <label class="block text-xs font-semibold text-slate-400 mb-1">${field.label}</label>
                        ${inputElement}
                    </div>
                `;
            });

            const modal = document.getElementById('crudModal');
            const modalContent = document.getElementById('modalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('crudModal');
            const modalContent = document.getElementById('modalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
        }

        function editItem(data) { openModal(data); }

        // ส่งข้อมูลบันทึก (Create / Update)
        async function saveData() {
            const schema = SCHEMAS[currentTab];
            let payloadData = {};
            const id = document.getElementById('form-id').value;
            if(id) payloadData.id = id;

            schema.forEach(field => {
                payloadData[field.key] = document.getElementById(`input-${field.key}`).value;
            });

            const payload = {
                sheet: currentTab,
                action: isEditMode ? 'update' : 'create',
                apiKey: API_KEY,
                data: payloadData
            };

            await sendPostRequest(payload, isEditMode ? 'อัปเดตข้อมูลสำเร็จ!' : 'เพิ่มข้อมูลสำเร็จ!');
        }

        // ลบข้อมูล (Delete)
        async function deleteItem(id) {
            const result = await Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "ข้อมูลนี้จะถูกลบออกจากระบบอย่างถาวร!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#334155',
                confirmButtonText: 'ใช่, ลบเลย!',
                cancelButtonText: 'ยกเลิก',
                background: '#111827',
                color: '#fff'
            });

            if (result.isConfirmed) {
                const payload = {
                    sheet: currentTab,
                    action: 'delete',
                    apiKey: API_KEY,
                    data: { id: id }
                };
                await sendPostRequest(payload, 'ลบข้อมูลสำเร็จ!');
            }
        }

        // ฟังก์ชันกลางสำหรับการส่ง POST ไปยัง Apps Script
        async function sendPostRequest(payload, successMessage) {
            showLoading(true);
            closeModal();
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                
                if (json.ok) {
                    Swal.fire({ icon: 'success', title: successMessage, showConfirmButton: false, timer: 1500, background: '#111827', color: '#fff' });
                    await loadData();
                } else {
                    throw new Error(json.error);
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: error.message, background: '#111827', color: '#fff' });
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
